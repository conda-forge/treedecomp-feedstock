{% set name = "treedecomp" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a64c5cf5005ab2f4950eeef806e337049ac56f5908917e0849de884833669234

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - networkx >=2

test:
  requires:
    - python {{ python_min }}
  imports:
    - treedecomp

about:
  home: https://gitlab.inria.fr/amibio/treedecomp
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE.txt
  summary: Python Class for Tree Decomposition
  doc_url: https://gitlab.inria.fr/amibio/treedecomp
  dev_url: https://gitlab.inria.fr/amibio/treedecomp

extra:
  recipe-maintainers:
    - anthonyhtyao
